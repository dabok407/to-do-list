appId: com.dabok407.hangeoreum
---
# Labels are supplied from the explicit language persisted by the Flutter test.
# Check the selected language exactly; accepting both would hide stale strings.
# Flutter adds a localized tab-position hint on a new accessibility line.
# Match the exact label and allow that system hint without accepting other labels.
- launchApp:
    stopApp: false
- extendedWaitUntil:
    visible: "${SETTINGS_LABEL}(\\n.*)?"
    timeout: 30000
- tapOn: "${SETTINGS_LABEL}(\\n.*)?"
- scrollUntilVisible:
    element:
      text: "${TEST_BUTTON}"
    direction: DOWN
    timeout: 30000
- tapOn: "${TEST_BUTTON}"
- pressKey: home
- stopApp
- swipe:
    start: "20%, 1%"
    end: "20%, 85%"
    duration: 1000
- extendedWaitUntil:
    visible: ".*${TEST_TITLE}.*"
    timeout: 30000
- assertVisible: ".*${TEST_BODY}.*"
- takeScreenshot: ios-background-notification
