appId: com.dabok407.hangeoreum
---
# Labels are supplied from the explicit language persisted by the Flutter test.
# Check the selected language exactly; accepting both would hide stale strings.
# Flutter adds a localized tab-position hint on a new accessibility line.
# Match the exact label and allow that system hint without accepting other labels.
- launchApp:
    stopApp: false
- extendedWaitUntil:
    visible: "${SETTINGS_LABEL}(\\n.*)?"
    timeout: 30000
# A cold widget link can leave task details open above the tab bar. Its
# dismissible barrier may consume a Settings tap, so close the visible sheet
# first and retry actual tab navigation at most three times. Require a field
# unique to Settings before looking for the reminder button.
- repeat:
    times: 3
    while:
      notVisible: "${SETTINGS_CONTENT}(\\n.*)?"
    commands:
      - runFlow:
          when:
            visible: "${CLOSE_LABEL}"
          commands:
            - tapOn: "${CLOSE_LABEL}"
      - tapOn: "${SETTINGS_LABEL}(\\n.*)?"
      - waitForAnimationToEnd:
          timeout: 3000
- extendedWaitUntil:
    visible: "${SETTINGS_CONTENT}(\\n.*)?"
    timeout: 30000
- scrollUntilVisible:
    element:
      text: "${TEST_BUTTON}"
    direction: DOWN
    timeout: 30000
- tapOn: "${TEST_BUTTON}"
- pressKey: home
- stopApp
- waitForAnimationToEnd:
    timeout: 3000
# The simulator can ignore an edge gesture during the SpringBoard transition.
# Retry the actual top-edge pull, bounded to three attempts; title/body checks
# below remain mandatory even when the panel never opens or delivery fails.
- repeat:
    times: 3
    while:
      notVisible: ".*${TEST_TITLE}.*|[0-9]+ Notifications?"
    commands:
      - swipe:
          start: "15%, 0%"
          end: "15%, 85%"
          duration: 1000
          waitToSettleTimeoutMs: 2000
# Notification Center can use the system's Count display instead of showing
# cards. Wait for delivery, then expand that visible control like a user would.
# The count is only navigation evidence; the exact title/body remain required.
- extendedWaitUntil:
    visible: ".*${TEST_TITLE}.*|[0-9]+ Notifications?"
    timeout: 30000
- runFlow:
    when:
      visible: "[0-9]+ Notifications?"
    commands:
      - tapOn: "[0-9]+ Notifications?"
- extendedWaitUntil:
    visible: ".*${TEST_TITLE}.*"
    timeout: 30000
- assertVisible: ".*${TEST_BODY}.*"
- takeScreenshot: ios-background-notification
